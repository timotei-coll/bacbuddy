<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BacBuddy · AI study assistant for Romania's Baccalaureate (Bac) with cited sources</title>
<meta name="description" content="BacBuddy answers Baccalaureate questions only from official Romanian exam materials and cites the exact source.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0b1020; --panel: #121a33; --panel-2: #18223f; --line: #26325a;
    --text: #e8ecf8; --muted: #9aa6c7; --accent: #ffcc33; --accent-ink: #2a2100;
    --blue: #4f7cff; --good: #3ccf8e; --bad: #ff6b6b; --radius: 14px; --glow: #1b2a5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); line-height: 1.55; min-height: 100vh;
  }
  a { color: #9db6ff; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .brand h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--muted); padding: 6px 14px; cursor: pointer; font-weight: 600; }
  .lang button.on { background: var(--panel-2); color: var(--text); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 8px; }
  .badge { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .tabs { display: flex; gap: 6px; margin: 18px 0 14px; }
  .tab { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 10px;
         border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 15px; }
  .tab.on { color: var(--text); border-color: var(--blue); background: var(--panel-2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  textarea { width: 100%; min-height: 86px; resize: vertical; background: var(--bg); color: var(--text);
             border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 15.5px; }
  textarea:focus, select:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 18px;
         font-weight: 700; cursor: pointer; font-size: 15px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .grow { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px;
          padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { color: var(--text); }
  .answer { margin-top: 16px; }
  .answer .body { font-size: 15.5px; }
  .answer .body p { margin: 0 0 10px; }
  .answer .body ul, .answer .body ol { margin: 0 0 10px; padding-left: 22px; }
  .cite { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; border-radius: 6px; background: var(--blue);
          color: #fff; font-size: 11.5px; font-weight: 700; text-decoration: none; text-align: center; vertical-align: 2px; }
  .sources { margin-top: 14px; display: grid; gap: 10px; }
  .src { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; scroll-margin-top: 20px; }
  .src.flash { border-color: var(--accent); }
  .src-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .src-title { font-weight: 700; font-size: 14px; }
  .src-title .n { color: var(--accent); margin-right: 6px; }
  .src-snip { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .src a { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid #5a4a12;
         border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .fb { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: var(--muted); font-size: 13.5px; }
  .fb button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 16px; }
  .fb button.on { border-color: var(--good); }
  .muted { color: var(--muted); font-size: 13.5px; }
  .err { color: var(--bad); margin-top: 12px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 8px; }
  footer { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
  .hidden { display: none !important; }
  /* score + belts */
  body { transition: background .6s; background: radial-gradient(1200px 600px at 10% -10%, var(--glow) 0%, transparent 60%), var(--bg); }
  .score { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .belt-chip { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .belt-dot { width: 26px; height: 12px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 0 2px #0006 inset; }
  .pts { font-size: 26px; font-weight: 800; color: var(--accent); }
  .bar { flex: 1; min-width: 140px; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  .answer-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .answer-row input { flex: 1; min-width: 180px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                      border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15.5px; }
  .verdict { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .verdict.ok { background: #123a2a; border: 1px solid var(--good); }
  .verdict.no { background: #3a1620; border: 1px solid var(--bad); }
  .modal { position: fixed; inset: 0; background: #000b; display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal-box { background: var(--panel); border: 1px solid var(--accent); border-radius: 18px; padding: 20px; max-width: 420px; width: 100%; text-align: center; }
  .modal-box img { width: 100%; border-radius: 12px; margin: 12px 0; border: 1px solid var(--line); }
  .modal-box h2 { margin: 6px 0; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--accent);
           padding: 10px 16px; border-radius: 12px; z-index: 40; font-weight: 600; }
  .katex { font-size: 1.05em; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px;
         font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
</style>

    streakBonus: "bonus serie", hintUsed: "cu indiciu", season: "🗓️ Scorul e pe sezon: se resetează în fiecare luni. Prinde centura neagră până atunci!",
    nextBelt: (n, b) => `Încă ${n} puncte până la ${b}.`, maxBelt: "Ai centura supremă. Respect! 🥷",
    levelUp: "Nivel nou!", download: "Descarcă cardul", share: "Distribuie", cont: "Continuă",
    cardLine: (p) => `${p} puncte la exerciții oficiale de Bac săptămâna asta`, cardCta: "Încearcă și tu:",
    expired: "Problema a expirat. Cere una nouă.",
    errGeneric: "A apărut o eroare. Încearcă din nou.",
    examples: ["Ce trebuie să știu despre funcții derivabile?", "Cum se punctează subiectul III la matematică?",
               "Ce algoritmi de sortare sunt în programă?", "Cum se punctează un subprogram la informatică?"]
  },
  en: {
    tagline: "AI study assistant for Romania's Baccalaureate exam, answering only from official materials",
    b1: "🇷🇴 Romanian Bac · Math M_mate-info & CS C/C++ · 2024–2026", b2: "🔗 Every answer is cited", b3: "🚫 Never makes things up",
    tabAsk: "💬 Ask", tabQuiz: "🎯 Quiz me",
    placeholder: "E.g.: What do I need to know about derivatives for the Bac?",
    allSubjects: "All subjects", math: "Math M_mate-info", cs: "Computer Science (C/C++)", allYears: "All years",
    ask: "Ask", thinking: "Searching the official materials…", sources: "Official sources",
    openPdf: "Open PDF ↗", page: "page", helpful: "Was this helpful?", thanks: "Thanks! 💛",
    quizIntro: "Get a problem from a real Bac exam paper. Try it, then reveal the official grading scheme from the same session.",
    newProblem: "New problem", hint: "Hint", showHint: "Show hint", showBarem: "Show official grading",
    fromExam: "From", whereFrom: "Where are you from? ", liveStats: "📊 Live stats",
    pts: "points", yourAnswer: "Your final answer (e.g. 3, x=2, {1,4}, b)", check: "Check",
    correct: "Correct!", wrong: "Not quite.", officialAnswer: "Answer from the official grading scheme",
    notCheckable: "This exercise has no final result to check automatically. See the official grading.",
    streakBonus: "streak bonus", hintUsed: "with hint", season: "🗓️ Scores are weekly: they reset every Monday. Get your black belt before then!",
    nextBelt: (n, b) => `${n} more points to ${b}.`, maxBelt: "You hold the highest belt. Respect! 🥷",
    levelUp: "Level up!", download: "Download card", share: "Share", cont: "Continue",
    cardLine: (p) => `${p} points on official Bac exam problems this week`, cardCta: "Try it too:",
    expired: "This problem expired. Get a new one.",
    errGeneric: "Something went wrong. Please try again.",
    examples: ["What topics about derivatives are in the curriculum?", "How is Subject III graded in Math?",
               "Which sorting algorithms are in the CS curriculum?", "How are subprograms graded in CS?"]
  }
};

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let lang = store("bb_lang") || ((navigator.language || "").startsWith("ro") ? "ro" : "en");
let client = store("bb_client");
if (!client) { client = Math.random().toString(36).slice(2) + Date.now().toString(36); store("bb_client", client); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Safe mini-markdown: escape first, then add bold, inline code, lists, paragraphs and citations.
// Citations [n] are only linked in AI answers (not in exam problems, where m[4][25] is C code),
// and never right after a letter/digit/bracket or inside `code`.
function render(md, prefix, withCitations = true) {
  const lines = esc(md).split(/\n/);
  let html = "", list = null;
  const inline = (t) => t.split(/(`[^`]+`)/g).map(part => {
    if (part.startsWith("`") && part.endsWith("`") && part.length > 2) return `<code>${part.slice(1, -1)}</code>`;
    let out = part.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (withCitations) out = out.replace(/(^|[^\w\]\[])((?:\[\d{1,2}\])+)/g, (m, pre, group) =>
      pre + group.replace(/\[(\d{1,2})\]/g,
        (x, n) => `<a class="cite" href="#${prefix}-${n}" data-ref="${prefix}-${n}">${n}</a>`));
    return out;
  }).join("");
  for (const raw of lines) {
    const line = raw.trim();
    const ul = line.match(/^[-*•]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const type = ul ? "ul" : "ol";
      if (list !== type) { if (list) html += `</${list}>`; html += `<${type}>`; list = type; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    } else {
      if (list) { html += `</${list}>`; list = null; }
      if (line) html += `<p>${inline(line)}</p>`;
    }
  }
  if (list) html += `</${list}>`;
  return html;
}

function renderMath(el) {
  if (window.renderMathInElement) {
    try { renderMathInElement(el, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false},
                                                  {left: "\\[", right: "\\]", display: true},
                                                  {left: "\\(", right: "\\)", display: false}], throwOnError: false }); } catch (e) {}
  }
}

function sourcesHtml(sources, prefix) {
  if (!sources || !sources.length) return "";
  const t = T[lang];
  return `<h3 style="margin:18px 0 8px;font-size:15px">${t.sources}</h3><div class="sources">` + sources.map(s => `
    <div class="src" id="${prefix}-${s.n}">
      <div class="src-top">
        <div class="src-title"><span class="n">[${s.n}]</span>${esc(s.label)}, ${t.page} ${s.page}
          <span class="tag">${esc(s.doc_type)}</span></div>
        <a href="${esc(s.url)}" target="_blank" rel="noopener">${t.openPdf}</a>
      </div>
      <div class="src-snip">${esc(s.snippet)}</div>
    </div>`).join("") + "</div>";
}

function wireCitations(root) {
  root.querySelectorAll(".cite").forEach(a => a.addEventListener("click", (e) => {
    const target = document.getElementById(a.dataset.ref);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1200);
  }));
}

function feedbackHtml(kind) {
  return `<div class="fb" data-kind="${kind}"><span>${T[lang].helpful}</span>
    <button data-v="1" aria-label="yes">👍</button><button data-v="0" aria-label="no">👎</button></div>`;
}
function wireFeedback(root) {
  const box = root.querySelector(".fb"); if (!box) return;
  box.querySelectorAll("button").forEach(b => b.addEventListener("click", async () => {
    box.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add("on");
    box.querySelector("span").textContent = T[lang].thanks;
    try { await post("/api/feedback", { helpful: b.dataset.v === "1", kind: box.dataset.kind }); } catch (e) {}
  }));
}

async function post(url, data) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...data, lang, client, country: $("country").value }) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || T[lang].errGeneric);
  return json;
}

function loading(el) { el.innerHTML = `<div class="card muted"><span class="spinner"></span>${T[lang].thinking}</div>`; }
function showError(el, msg) { el.innerHTML = `<div class="card err">${esc(msg)}</div>`; }

// ---------- ASK ----------
async function ask(q) {
  const question = (q || $("question").value).trim();
  if (question.length < 3) { $("question").focus(); return; }
  $("question").value = question;
  const out = $("ask-out"), btn = $("ask-btn");
  btn.disabled = true; loading(out);
  try {
    const r = await post("/api/ask", { question, subject: $("subject").value, year: $("year").value });
    out.innerHTML = `<div class="card"><div class="body">${render(r.answer, "a")}</div>
      ${sourcesHtml(r.sources, "a")}${feedbackHtml("ask")}</div>`;
    renderMath(out); wireCitations(out); wireFeedback(out);
  } catch (e) { showError(out, e.message); }
  btn.disabled = false;
}

// ---------- SCORE + BELTS ----------
const BELTS = [
  { min: 0,   ro: "Centura albă",       en: "White belt",  accent: "#f1f3fa", ink: "#14182a", glow: "#2a3354" },
  { min: 50,  ro: "Centura galbenă",    en: "Yellow belt", accent: "#ffcc33", ink: "#2a2100", glow: "#4a3d10" },
  { min: 100, ro: "Centura portocalie", en: "Orange belt", accent: "#ff8a3d", ink: "#2a1200", glow: "#5a2a10" },
  { min: 200, ro: "Centura verde",      en: "Green belt",  accent: "#3ccf8e", ink: "#062a1a", glow: "#10442e" },
  { min: 300, ro: "Centura albastră",   en: "Blue belt",   accent: "#4f9dff", ink: "#04142e", glow: "#16336a" },
  { min: 450, ro: "Centura maro",       en: "Brown belt",  accent: "#c8915f", ink: "#24140a", glow: "#4a2e18" },
  { min: 650, ro: "Centura neagră",     en: "Black belt",  accent: "#d4af37", ink: "#1a1400", glow: "#000000" },
];
const MOTIVATION = {
  ro: ["Primul pas e făcut. Bacul se câștigă exercițiu cu exercițiu!",
       "Ai prins ritmul! Încă puțin și ești peste media clasei.",
       "100 de puncte! Așa arată cineva care chiar învață pentru Bac. 🔥",
       "Centura verde: baremul începe să fie prietenul tău.",
       "Centura albastră: rezolvi ca la examen. Ține-o tot așa!",
       "Centura maro: ești la un pas de vârf. Nu te opri acum!",
       "CENTURA NEAGRĂ! Ești pregătit de Bac. Respect total! 🥷"],
  en: ["First step done. The Bac is won one exercise at a time!",
       "You found your rhythm! Keep going.",
       "100 points! That's what real Bac preparation looks like. 🔥",
       "Green belt: the grading scheme is becoming your friend.",
       "Blue belt: you solve like it's exam day. Keep it up!",
       "Brown belt: one step from the top. Don't stop now!",
       "BLACK BELT! You're ready for the Bac. Total respect! 🥷"],
};

function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + "-W" + Math.ceil(((t - y) / 86400000 + 1) / 7);
}
function loadScore() {
  let s = null; try { s = JSON.parse(store("bb_score") || "null"); } catch (e) {}
  const week = isoWeek();
  if (!s || s.week !== week) s = { week, points: 0, streak: 0, belt: 0 };   // weekly reset (Monday)
  return s;
}
let score = loadScore();
function saveScore() { store("bb_score", JSON.stringify(score)); }
function beltIndex(points) { let i = 0; BELTS.forEach((b, k) => { if (points >= b.min) i = k; }); return i; }

function applyTheme(i) {
  const b = BELTS[i], r = document.documentElement.style;
  r.setProperty("--accent", b.accent); r.setProperty("--accent-ink", b.ink); r.setProperty("--glow", b.glow);
}
function renderScore() {
  const i = beltIndex(score.points), b = BELTS[i], next = BELTS[i + 1], t = T[lang];
  applyTheme(i);
  $("pts").textContent = score.points; $("streak").textContent = score.streak;
  $("belt-name").textContent = b[lang];
  const pct = next ? 100 * (score.points - b.min) / (next.min - b.min) : 100;
  $("bar-fill").style.width = Math.max(3, Math.min(100, pct)) + "%";
  $("next-belt").textContent = next ? t.nextBelt(next.min - score.points, next[lang]) : t.maxBelt;
}
function addPoints(delta) {
  const before = beltIndex(score.points);
  score.points = Math.max(0, score.points + delta);
  const after = beltIndex(score.points);
  if (after > score.belt) score.belt = after;
  saveScore(); renderScore();
  if (after > before) levelUp(after);
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

// ---------- level up: confetti + motivational message + shareable card ----------
function confetti() {
  const c = $("confetti"), ctx = c.getContext("2d");
  c.classList.remove("hidden"); c.width = innerWidth; c.height = innerHeight;
  const colors = [BELTS[beltIndex(score.points)].accent, "#ffffff", "#4f7cff", "#3ccf8e", "#ff6b6b"];
  const parts = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height / 2,
    vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, s: 4 + Math.random() * 6, r: Math.random() * 6,
    col: colors[Math.floor(Math.random() * colors.length)] }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++frames < 200) requestAnimationFrame(tick); else c.classList.add("hidden");
  })();
}

function drawCard(i) {
  const b = BELTS[i], t = T[lang], c = document.createElement("canvas");
  c.width = 1080; c.height = 1350; const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 1080, 1350);
  grad.addColorStop(0, "#0b1020"); grad.addColorStop(1, b.glow === "#000000" ? "#1a1400" : b.glow);
  g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
  const font = (w, sz) => `${w} ${sz}px Inter, "Segoe UI", Roboto, Arial, sans-serif`;
  g.fillStyle = b.accent; g.beginPath(); g.roundRect(90, 90, 110, 110, 28); g.fill();
  g.fillStyle = b.ink; g.font = font(800, 64); g.textAlign = "center"; g.fillText("B", 145, 168);
  g.textAlign = "left"; g.fillStyle = "#e8ecf8"; g.font = font(800, 64); g.fillText("BacBuddy", 230, 168);
  // belt
  g.fillStyle = b.accent; g.beginPath(); g.roundRect(140, 380, 800, 120, 24); g.fill();
  g.fillStyle = "#0006"; g.fillRect(500, 380, 80, 120);
  g.fillStyle = b.accent; g.beginPath(); g.moveTo(500, 500); g.lineTo(450, 640); g.lineTo(520, 640); g.lineTo(540, 500); g.fill();
  g.beginPath(); g.moveTo(580, 500); g.lineTo(630, 640); g.lineTo(560, 640); g.lineTo(540, 500); g.fill();
  g.textAlign = "center"; g.fillStyle = "#ffffff"; g.font = font(800, 84); g.fillText(b[lang], 540, 790);
  g.fillStyle = b.accent; g.font = font(800, 150); g.fillText(String(score.points), 540, 960);
  g.fillStyle = "#c9d2ea"; g.font = font(500, 40); wrap(g, t.cardLine(score.points), 540, 1030, 860, 52);
  g.fillStyle = "#9aa6c7"; g.font = font(500, 34); g.fillText(t.cardCta, 540, 1200);
  g.fillStyle = "#ffffff"; g.font = font(700, 40); g.fillText(location.host || "bacbuddy", 540, 1255);
  return c;
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) { const test = line ? line + " " + w : w;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else line = test; }
  g.fillText(line, x, y);
}

function levelUp(i) {
  confetti();
  try { post("/api/event", { kind: "level_up" }); } catch (e) {}
  const b = BELTS[i], t = T[lang], canvas = drawCard(i), url = canvas.toDataURL("image/png");
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="modal-box">
      <div class="muted">${t.levelUp}</div><h2 style="color:${b.accent}">🥋 ${esc(b[lang])}</h2>
      <p>${esc(MOTIVATION[lang][i] || "")}</p><img alt="card" src="${url}">
      <div class="row" style="justify-content:center"><button class="btn" id="m-share">${t.share}</button>
      <a class="btn ghost" id="m-dl" download="bacbuddy-${b.en.replace(/ /g, "-").toLowerCase()}.png" href="${url}" style="text-decoration:none">${t.download}</a>
      <button class="btn ghost" id="m-close">${t.cont}</button></div></div>`;
  document.body.appendChild(m);
  const logShare = () => { try { post("/api/event", { kind: "share_card" }); } catch (e) {} };
  m.querySelector("#m-dl").onclick = logShare;
  m.querySelector("#m-close").onclick = () => m.remove();
  m.querySelector("#m-share").onclick = () => canvas.toBlob(async (blob) => {
    const file = new File([blob], "bacbuddy.png", { type: "image/png" });
    const data = { title: "BacBuddy", text: `${b[lang]} · ${t.cardLine(score.points)} · ${location.origin}`, files: [file] };
    try {
      if (navigator.canShare && navigator.canShare(data)) { await navigator.share(data); logShare(); }
      else { m.querySelector("#m-dl").click(); }
    } catch (e) {}
  });
}

// ---------- QUIZ ----------
let currentQuiz = null, hintUsed = false;
async function newQuiz() {
  const out = $("quiz-out"), btn = $("quiz-btn");
  btn.disabled = true; loading(out); hintUsed = false;
  try {
    let seen = []; try { seen = JSON.parse(store("bb_seen") || "[]"); } catch (e) {}
    const r = await post("/api/quiz", { subject: $("quiz-subject").value, seen: seen.slice(-250) });
    if (r.error) throw new Error(T[lang].errGeneric);
    currentQuiz = r;
    if (r.exercise_key) {   // remember it; when every exercise was seen, start a new round
      seen = r.remaining === 0 ? [r.exercise_key] : seen.filter(k => k !== r.exercise_key).concat(r.exercise_key);
      store("bb_seen", JSON.stringify(seen.slice(-250)));
    }
    const t = T[lang];
    out.innerHTML = `<div class="card">
      <div class="muted">${t.fromExam}: <a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.label)}, ${t.page} ${r.source.page} ↗</a></div>
      <div class="body" style="margin-top:10px">${render(r.problem, "q", false)}</div>
      ${r.hint ? `<button class="btn ghost" id="hint-btn" style="margin-top:6px">${t.showHint}</button>
        <div class="hint hidden" id="hint-box"><strong>${t.hint}:</strong> ${render(r.hint, "q", false)}</div>` : ""}
      ${r.checkable ? `<div class="answer-row"><input id="quiz-answer" maxlength="200" placeholder="${esc(t.yourAnswer)}">
        <button class="btn" id="check-btn">${t.check}</button></div>`
        : `<p class="muted">${t.notCheckable}</p>`}
      <div id="verdict"></div>
      <div class="row"><button class="btn ghost" id="barem-btn">${t.showBarem}</button></div>
      <div id="solution"></div></div>`;
    renderMath(out);
    const hb = $("hint-btn");
    if (hb) hb.onclick = () => { $("hint-box").classList.remove("hidden"); hb.remove(); hintUsed = true; };
    $("barem-btn").onclick = showSolution;
    if (r.checkable) {
      $("check-btn").onclick = checkAnswer;
      $("quiz-answer").addEventListener("keydown", e => { if (e.key === "Enter") checkAnswer(); });
      $("quiz-answer").focus();
    }
  } catch (e) { showError(out, e.message); }
  btn.disabled = false;
}

async function checkAnswer() {
  const input = $("quiz-answer"), btn = $("check-btn"), box = $("verdict"), t = T[lang];
  if (!input.value.trim()) { input.focus(); return; }
  btn.disabled = true; input.disabled = true; loading(box);
  try {
    const r = await post("/api/quiz/check", { quiz_id: currentQuiz.quiz_id, answer: input.value });
    if (r.error) throw new Error(r.error === "expired" ? t.expired : t.errGeneric);
    let delta, detail;
    if (r.correct) {
      score.streak += 1;
      delta = hintUsed ? 5 : 10;
      detail = `+${delta}${hintUsed ? " (" + t.hintUsed + ")" : ""}`;
      if (score.streak % 3 === 0) { delta += 5; detail += ` · +5 ${t.streakBonus} 🔥`; }
    } else {
      score.streak = 0; delta = -3; detail = "−3";
    }
    box.innerHTML = `<div class="verdict ${r.correct ? "ok" : "no"}">${r.correct ? "✅ " + t.correct : "❌ " + t.wrong} <span>${detail}</span>
      <div class="muted" style="font-weight:400;margin-top:6px">${t.officialAnswer}: <span class="ans">${esc(r.expected)}</span>
      ${r.explanation ? "<br>" + esc(r.explanation) : ""}</div></div>`;
    renderMath(box);
    addPoints(delta);
    btn.remove();
  } catch (e) { showError(box, e.message); btn.disabled = false; input.disabled = false; }
}

async function showSolution() {
  const box = $("solution"), btn = $("barem-btn");
  btn.disabled = true; loading(box);
  try {
    const r = await post("/api/quiz/solution", { quiz_ref: currentQuiz.quiz_ref });
    box.innerHTML = `<div style="margin-top:14px" class="body">${render(r.answer, "s")}</div>
      ${sourcesHtml(r.sources, "s")}${feedbackHtml("quiz")}`;
    renderMath(box); wireCitations(box); wireFeedback(box); btn.remove();
  } catch (e) { showError(box, e.message); btn.disabled = false; }
}

// ---------- language + tabs ----------
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t[el.dataset.i18nPh]);
  $("lang-ro").classList.toggle("on", lang === "ro"); $("lang-en").classList.toggle("on", lang === "en");
  $("examples").innerHTML = t.examples.map(x => `<button class="chip">${esc(x)}</button>`).join("");
  $("examples").querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
  renderScore();
}
$("lang-ro").onclick = () => { lang = "ro"; store("bb_lang", lang); applyLang(); };
$("lang-en").onclick = () => { lang = "en"; store("bb_lang", lang); applyLang(); };
function showTab(name) {
  $("tab-ask").classList.toggle("on", name === "ask"); $("tab-quiz").classList.toggle("on", name === "quiz");
  $("view-ask").classList.toggle("hidden", name !== "ask"); $("view-quiz").classList.toggle("hidden", name !== "quiz");
}
$("tab-ask").onclick = () => showTab("ask");
$("tab-quiz").onclick = () => showTab("quiz");
$("ask-btn").onclick = () => ask();
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });
$("quiz-btn").onclick = newQuiz;
$("country").value = store("bb_country") || "";
$("country").onchange = () => store("bb_country", $("country").value);
applyLang();
</script>
